services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - db
    volumes:
      - media_storage:/app/media

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: ./bot/.env
    depends_on:
      - api
    volumes:
      - media_storage:/app/media

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_storage:/usr/share/nginx/html/media:ro
    depends_on:
      - api

volumes:
  postgres_data:
  media_storage:
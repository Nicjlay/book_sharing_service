services:
  api:
    build:
      dockerfile: Dockerfile
    container_name: library_api
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./src:/app        # для разработки; при необходимости можно вынести в .env
      - ./media:/app/media
    environment:
      - MODE=${MODE}
      # Для сборки DATABASE_URL используем переменные из .env
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # Остальные переменные для приложения
      - API_TOKEN=${API_TOKEN}
      - BOT_WEBHOOK_URL=${BOT_WEBHOOK_URL}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      - MEDIA_UPLOAD_DIR=${MEDIA_UPLOAD_DIR}
      - APP_HOST=${APP_HOST}
      - APP_PORT=${APP_PORT}
    networks:
      - library_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: library_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library_network

networks:
  library_network:
    name: library_network
    driver: bridge

volumes:
  postgres_data:
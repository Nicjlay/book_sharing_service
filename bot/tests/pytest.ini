[pytest]
# Режим asyncio: auto означает что все async тесты автоматически
# оборачиваются в asyncio.run() — не нужно вручную ставить декоратор
asyncio_mode = auto

# Показываем все warning-и в выводе тестов
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:aiogram

# Директория с тестами
testpaths = tests

# Дополнительные аргументы по умолчанию
# -v: подробный вывод (имя каждого теста)
# --tb=short: короткий traceback при ошибке
addopts = -v --tb=short

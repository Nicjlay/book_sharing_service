version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_bot
    ports:
      - "8001:8001"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_URL=${API_URL}
      - API_TOKEN=${API_TOKEN}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS}
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8001
      - GROUP_CHAT_ID=${GROUP_CHAT_ID:-}
    restart: unless-stopped
    networks:
      - library_network

networks:
  library_network:
    name: library_network
    external: true  # Подключаемся к сети API